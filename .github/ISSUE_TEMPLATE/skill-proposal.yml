name: Skill proposal
description: 提议新增或拆分一个 Shopex Agent Skill
title: "[Skill Proposal]: "
labels: ["skill-proposal"]
body:
  - type: textarea
    id: task
    attributes:
      label: 用户任务
      description: 用户要完成什么？请给出真实请求示例。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - ecx
        - oms
        - digios
        - common
        - suite
        - router
        - new-product-prefix
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 建议 Skill 名称
      placeholder: ecx-order-diagnosis
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 触发和不触发示例
      description: 至少列出三个正例、三个反例和一个相邻边界。
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: 与现有 Skill 的关系
      description: 为什么不能扩展已有 Skill？是否依赖其他能力？
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 工具、权限和风险
      description: 是否执行脚本、联网、读取凭据或写入生产系统？
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: 负责长期维护的 GitHub 用户或团队。
    validations:
      required: true
