name: Validate Agent Skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Shopex conventions
        run: python3 scripts/validate_skills.py
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_skills.py
